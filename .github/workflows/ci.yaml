name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache mise tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock') }}
          restore-keys: |
            mise-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true

      - name: Cache Bun install
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format check (Prettier)
        run: bun run prettier --check "src/**/*.{ts,html,scss,css,json}" "*.{json,md}"

      - name: Lint (ESLint)
        run: bun run eslint .

      - name: Security scan (Trivy filesystem)
        run: mise exec -- trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed .
